# Memaix — single-tenant deployment. En instans per kund.
# Tjänster: gateway (kärnan) + valfri cloudflared (tunnel) + valfri nextcloud (backend).

services:
  gateway:
    build: ./gateway
    image: memaix/gateway:latest
    restart: unless-stopped
    # Utan detta kör containern som root medan bind-mountarna nedan behåller
    # värdens ägarskap. Git ≥2.35 vägrar då operera på ./vaults — "detected
    # dubious ownership", exit 128, på varje kommando. Det var inte en teori:
    # sex av sju valv i produktion innehöll noll commits medan `.git` fanns i
    # alla sju, eftersom `git init` lyckas som root (det finns ännu inget repo
    # att misstro) och allt därefter föll. Versionerat minne är produktens
    # kärnlöfte, och det hade aldrig levererat en enda dag.
    #
    # Variabel snarare än hårdkodad 1000, för att "en instans per kund" ska
    # vara sant även när kundens uid inte är 1000.
    #
    # Kontrollera ägarskapet REKURSIVT innan första start, inte på toppnivån:
    #   find vaults config data ! -uid "$MEMAIX_UID" -printf '%u %p\n'
    # Vid deployen 2026-09-07 ägdes alla tre katalogerna av 1000 medan tio
    # SQLite-databaser inuti data/ — inklusive audit-loggen — ägdes av root.
    # Ett `stat` på toppnivån hade sagt att allt var i sin ordning och vi hade
    # bytt ett trasigt git mot en revisionslogg som inte gick att skriva till.
    user: "${MEMAIX_UID:-1000}:${MEMAIX_GID:-1000}"
    env_file: .env
    environment:
      MEMAIX_TRANSPORT: http
      MEMAIX_DATA_DIR: /data
    volumes:
      # rw: /app/admin skriver acl.yaml (AclWriter/MFA) och memaix.yaml:s
      # model-block (AI-valet) atomiskt med backup-rotation; :ro bröt de flödena.
      - ./config:/app/config               # brand.yaml, memaix.yaml, acl.yaml
      - ./vaults:/srv/vaults               # git-versionerade minnesvaults
      - ./data:/data                       # sqlite-state: notify/rules/tokens/audit/outbox m.fl. (durability)
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      hydra:
        condition: service_started
    profiles: ["hydra"]

  login-app:
    build:
      context: .
      dockerfile: login-app/Dockerfile
    image: memaix/login-app:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config/acl.yaml:/app/config/acl.yaml:ro
      # rw: approved_clients.db (memaix-src 4c8f32fe) — (subject, client_id)
      # approvals for the login skip check. Not the gateway's ./data (that's
      # its own service's sqlite state); a separate subdir keeps ownership clear.
      - ./data/login-app:/data
    profiles: ["hydra"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - gateway
      - hydra
      - login-app
    profiles: ["hydra"]

  # Valfritt: Cloudflare-tunnel. Tar bort behovet av portöppning; ger auto-TLS.
  #
  # VARNING (driftlärdom): token-läget är FJÄRRHANTERAT — ingress-reglerna läses
  # från Cloudflares API vid uppstart, inte live. Om konfig-versionen där saknar
  # hostname-regler (t.ex. en oavsiktlig "source: local"-version som ersatte
  # dashboard-reglerna) svarar tunneln 503 på allt, trots "healthy". Föredra
  # tunnel-local-profilen nedan för drift.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [caddy]
    profiles: ["tunnel"]                   # aktivera med: docker compose --profile tunnel up -d

  # Rekommenderad för drift: LOKALT hanterad tunnel. Ingress-reglerna ligger i
  # ./cloudflared/config.yml (se config.example.yml för uppsättning) — en fil i
  # deployen som en omstart eller en fjärrkonfig-version aldrig kan nolla.
  cloudflared-local:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on: [caddy]
    profiles: ["tunnel-local"]             # aktivera med: docker compose --profile tunnel-local up -d

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: ${HYDRA_DB_PASSWORD}
      POSTGRES_DB: hydra
    volumes:
      - hydra-db:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: initdb:s tillfälliga server lyssnar bara på unix-socket,
      # så TCP-kontrollen blir inte grön förrän den riktiga servern är uppe.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hydra -d hydra"]
      interval: 2s
      timeout: 5s
      retries: 30
    profiles: ["hydra"]

  # Hydras schema. Utan det här steget dör `serve` vid varje start på en ny
  # installation med "Unable to locate the table" och startar om i en loop —
  # hittat av installer-e2e. Driften hade migrerats för hand en gång; ingen
  # ny installation hade fungerat. Migreringen är idempotent: redan tillämpade
  # steg hoppas över, så befintliga instanser påverkas inte.
  hydra-migrate:
    image: oryd/hydra:v2.2
    command: migrate sql -e --yes
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD}@postgres:5432/hydra?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["hydra"]

  hydra:
    image: oryd/hydra:v2.2
    restart: unless-stopped
    command: serve all --dev
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD}@postgres:5432/hydra?sslmode=disable
      URLS_SELF_ISSUER: ${HYDRA_PUBLIC_URL:-https://mcp.example.com/}
      URLS_CONSENT: ${HYDRA_CONSENT_URL:-https://mcp.example.com/consent}
      URLS_LOGIN: ${HYDRA_LOGIN_URL:-https://mcp.example.com/login}
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET}
      LOG_LEVEL: debug
      LOG_LEAK_SENSITIVE_VALUES: "true"
      STRATEGIES_ACCESS_TOKEN: jwt
      OIDC_DYNAMIC_CLIENT_REGISTRATION_ENABLED: "true"
      # Hydra i --dev sätter inte Secure på sina kakor, men defaultar till
      # SameSite=None — en kombination varje modern webbläsare avvisar. Kakan
      # lagras då aldrig, och nästa steg i flödet dör med
      # "No CSRF value available in the session cookie".
      # Lax kräver inte Secure och räcker här: login och consent ligger på
      # samma host som Hydra, och Lax släpper igenom top-level-navigeringen
      # in från klienten.
      SERVE_COOKIES_SAME_SITE_MODE: "Lax"
      SERVE_PUBLIC_CORS_ENABLED: "true"
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS: "https://claude.ai,https://api.claude.ai"
      SERVE_PUBLIC_CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
    ports:
      - "127.0.0.1:4444:4444"   # public API
      - "127.0.0.1:4445:4445"   # admin API
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    profiles: ["hydra"]

  # Valfritt: Nextcloud som backend för kalender (CalDAV) + filer (WebDAV).
  nextcloud:
    image: nextcloud:latest
    restart: unless-stopped
    environment:
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost ${NEXTCLOUD_PUBLIC_HOST:-}"
    volumes:
      - nextcloud-data:/var/www/html
    ports:
      - "127.0.0.1:8081:80"
    profiles: ["nextcloud"]

  # ntfy — self-hosted push notifications, reachable via Cloudflare tunnel at
  # ntfy.jimlov.se. Auth: deny-all default, per-topic grants via `ntfy access`.
  # Bara localhost-exponerad; nås genom tunneln, inte direkt.
  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: "https://ntfy.jimlov.se"
      NTFY_AUTH_FILE: "/var/lib/ntfy/auth.db"
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
      NTFY_CACHE_FILE: "/var/cache/ntfy/cache.db"
      NTFY_BEHIND_PROXY: "true"
      NTFY_LISTEN_HTTP: ":80"
    volumes:
      - ./ntfy/etc:/etc/ntfy
      - ./ntfy/lib:/var/lib/ntfy
      - ./ntfy/cache:/var/cache/ntfy
    ports:
      - "127.0.0.1:8082:80"

volumes:
  nextcloud-data:
  hydra-db:
