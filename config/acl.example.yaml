users:
  alice:
    # admin: true ger implicit owner på alla projekt + tillgång till /app/admin
    admin: true
    # OAuth subject från Hydra. login-app sätter alltid subject = användarnamnet
    # som skrevs in på inloggningsformuläret (login-app/app.py:login_post) —
    # det är inte ett separat genererat id. Så oauth_subjects-listan här är i
    # praktiken bara "vilka inloggningsnamn får mappa till den här acl-användaren",
    # och normalfallet är en post som är identisk med användarens eget id.
    oauth_subjects:
      - alice
    # Per-user lösenord för login-appen. Generera med: python3 -c "
    #   import hashlib, secrets, sys; s=secrets.token_hex(16);
    #   h=hashlib.pbkdf2_hmac('sha256',sys.argv[1].encode(),bytes.fromhex(s),200_000);
    #   print(s+':'+h.hex())" 'ditt-lösenord'
    # password_hash: salt_hex:pbkdf2_hex
    grants:
      acme: owner
      project-a: owner
      project-b: owner
      personal: owner
      shared: owner
  bob:
    oauth_subjects:
      - bob
    # password_hash: salt_hex:pbkdf2_hex
    grants:
      acme: collaborator
      shared: reader

# Service-klienter (docs/AI-CLIENTS.md#service-klienter-client_credentials):
# en Hydra-klient med client_credentials som agerar som en användare men bara
# får anropa verktygen i `tools` och bara i projekten i `projects`. Saknas
# `tools` får klienten ingenting. Nyckeln är Hydra-klientens UUID (= token-sub)
# och får inte samtidigt stå som oauth_sub/oauth_subjects hos en användare.
# service_clients:
#   00000000-0000-0000-0000-000000000000:
#     acts_as: alice
#     tools: [email_search, email_read, email_attachments, email_attachment_get, email_export_pdf]
#     projects: [acme]

projects:
  acme:
    vault: /srv/vaults/acme
    allow_send: true
    # Per-user Google Calendar — each user links their own account via account_link("google")
    # calendar:
    #   type: google
    #   auth: per_user
    #
    # Outbox (FEATURE-APPROVAL-OUTBOX.md): gate outgoing/hard-to-undo actions
    # (email_send, calendar_create/update) behind human approval.
    #   outbox: review          # 'auto' (default, unchanged behaviour) | 'review'
    #   allowlist:               # optional — force 'review' for any recipient
    #     - "@trusted-client.example"    # not on this list, even in 'auto' mode
    #     - "specific@partner.example"
    #
    # Contacts (FEATURE-NEXTCLOUD-BACKEND.md) — enables contacts_search/contacts_get.
    # 'type' defaults to 'carddav' (the only adapter registered today).
    # contacts:
    #   url: "https://cloud.example.com/remote.php/dav/addressbooks/users/acme/contacts/"
    #   user: "acme@example.com"
    #   password_ref: "env:ACME_NEXTCLOUD_APP_PASSWORD"
    #
    # Files (FEATURE-NEXTCLOUD-BACKEND.md) — enables nc_files_list/read/write/search.
    # A separate resource from `vault` (the local, always-on project vault) —
    # this is an *additional* files source, e.g. a client's shared Nextcloud
    # folder. 'type' defaults to 'webdav' (the only adapter registered today).
    # files:
    #   url: "https://cloud.example.com/remote.php/dav/files/acme/Projects/acme/"
    #   user: "acme@example.com"
    #   password_ref: "env:ACME_NEXTCLOUD_APP_PASSWORD"
    #
    # Tasks (FEATURE-NEXTCLOUD-BACKEND.md) — enables nc_tasks_list/add/complete.
    # A CalDAV VTODO collection — typically a *different* URL from `calendar`
    # (a task list, not an event calendar), even though both default to
    # 'type: caldav'. 'type' defaults to 'caldav' (the only adapter registered today).
    # tasks:
    #   url: "https://cloud.example.com/remote.php/dav/calendars/acme/tasks/"
    #   user: "acme@example.com"
    #   password_ref: "env:ACME_NEXTCLOUD_APP_PASSWORD"
    #
    # Deck (FEATURE-NEXTCLOUD-BACKEND.md) — enables deck_sync (owner only,
    # two-way sync against the project's backlog). 'url' is the Nextcloud
    # base URL (not a DAV path — Deck is its own REST API), plus which
    # board/stack to sync. 'type' defaults to 'nextcloud' (the only adapter
    # registered today).
    # deck:
    #   url: "https://cloud.example.com"
    #   user: "acme@example.com"
    #   password_ref: "env:ACME_NEXTCLOUD_APP_PASSWORD"
    #   board_id: 1
    #   stack_id: 2
    #
    # Notes (FEATURE-NEXTCLOUD-BACKEND.md) — enables notes_sync (owner only,
    # two-way sync against memory/ notes). 'url' is the Nextcloud base URL
    # (Notes is its own REST API, like Deck). 'type' defaults to 'nextcloud'
    # (the only adapter registered today).
    # notes:
    #   url: "https://cloud.example.com"
    #   user: "acme@example.com"
    #   password_ref: "env:ACME_NEXTCLOUD_APP_PASSWORD"
  project-a:
    vault: /srv/vaults/project-a
    allow_send: true
  project-b:
    vault: /srv/vaults/project-b
    allow_send: false
  personal:
    vault: /srv/vaults/personal
    allow_send: true
  shared:
    vault: /srv/vaults/shared
    allow_send: false
  memaix:
    vault: /srv/vaults/memaix
    allow_send: false
