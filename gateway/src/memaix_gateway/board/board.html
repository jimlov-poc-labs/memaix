<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memaix Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<!--MEMAIX_I18N-->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fffdf7;
  --surface:#ffffff;
  --border:#111111;
  --border-light:#e0ddd6;
  --text:#111111;
  --muted:#6b6560;
  --primary:#3D7A8F;
  --primary-light:#d9edf2;
  --primary-dark:#2a5f70;
  --danger:#c0392b;
  --card-shadow:3px 3px 0px #111111;
  --card-shadow-hover:4px 4px 0px #111111;
  --radius:6px;
  --font:'Bricolage Grotesque',system-ui,sans-serif;
}

[data-theme="dark"]{
  --bg:#1c1917;
  --surface:#252220;
  --border:#e0ddd6;
  --border-light:#3a3532;
  --text:#fffdf7;
  --muted:#a09890;
  --primary:#4a9ab0;
  --primary-light:#1e3640;
  --primary-dark:#6bbdd4;
  --danger:#e05c4b;
  --card-shadow:3px 3px 0px #e0ddd6;
  --card-shadow-hover:4px 4px 0px #e0ddd6;
}
[data-theme="dark"] .col{border-color:var(--border);box-shadow:3px 3px 0 var(--border)}
[data-theme="dark"] .card{border-color:var(--border);box-shadow:var(--card-shadow)}
[data-theme="dark"] .modal{border-color:var(--border);box-shadow:6px 6px 0 var(--border)}
[data-theme="dark"] .icon-btn{box-shadow:2px 2px 0 var(--border)}
[data-theme="dark"] .icon-btn:hover{box-shadow:3px 3px 0 var(--border)}
[data-theme="dark"] .btn-primary{border-color:var(--border);box-shadow:3px 3px 0 var(--border)}
[data-theme="dark"] header select{box-shadow:2px 2px 0 var(--border)}
[data-theme="dark"] .mine-filter{box-shadow:2px 2px 0 var(--border)}
[data-theme="dark"] .mine-filter:hover{box-shadow:3px 3px 0 var(--border)}
[data-theme="dark"] .login-card{border-color:var(--border);box-shadow:var(--card-shadow)}
[data-theme="dark"] .cat-chore{background:#2a2825;border-color:#4a4540}
[data-theme="dark"] .empty-col{border-color:#3a3532;color:#4a4540}
[data-theme="dark"] .toast{background:#fffdf7;color:#111;border-color:#aaa}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:14px}

/* Login */
#login-gate{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)}
.login-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;width:360px;box-shadow:var(--card-shadow)}
.login-card h1{font-size:1.5rem;font-weight:800;margin-bottom:.2rem;letter-spacing:-.02em}
.login-card p{color:var(--muted);font-size:.875rem;margin-bottom:1.75rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.8rem;font-weight:700;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.form-group input{width:100%;padding:.6rem .75rem;border:1.5px solid var(--border);border-radius:var(--radius);font-size:.9rem;font-family:var(--font);outline:none;background:var(--bg)}
.form-group input:focus{border-color:var(--primary);box-shadow:2px 2px 0 var(--primary)}
.btn-primary{width:100%;padding:.7rem;background:var(--primary);color:#fff;border:1.5px solid var(--border);border-radius:var(--radius);font-size:.9rem;font-weight:700;font-family:var(--font);cursor:pointer;box-shadow:3px 3px 0 var(--border);transition:transform .1s,box-shadow .1s}
.btn-primary:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--border)}
.btn-primary:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--border)}
.login-error{color:var(--danger);font-size:.82rem;margin-top:.75rem;min-height:1.2em;font-weight:500}

/* Shell */
#board-shell{display:flex;flex-direction:column;height:100vh}

/* Topbar */
header{background:var(--surface);border-bottom:1.5px solid var(--border);padding:.625rem 1rem;display:flex;align-items:center;gap:.625rem;flex-shrink:0;min-height:48px}
.hdr-logo{font-weight:800;font-size:1rem;color:var(--primary);letter-spacing:-.02em;margin-right:.25rem;white-space:nowrap}
header select{padding:.35rem .55rem;border:1.5px solid var(--border);border-radius:var(--radius);font-size:.8rem;font-family:var(--font);font-weight:600;background:var(--bg);color:var(--text);cursor:pointer;box-shadow:2px 2px 0 var(--border)}
header select:focus{outline:none;border-color:var(--primary)}
.spacer{flex:1}
#user-badge{font-size:.75rem;color:var(--muted);background:var(--bg);padding:.3rem .65rem;border-radius:20px;border:1.5px solid var(--border-light);font-weight:600;white-space:nowrap}
.icon-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius);padding:.3rem .55rem;cursor:pointer;font-size:.85rem;color:var(--text);font-family:var(--font);font-weight:600;box-shadow:2px 2px 0 var(--border);transition:transform .1s,box-shadow .1s;white-space:nowrap}
.icon-btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--border)}
.icon-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--border)}
.icon-btn.active{background:var(--primary);color:#fff;border-color:var(--primary-dark)}

/* Main area */
#main-area{display:flex;flex:1;overflow:hidden}

/* Columns */
#board-columns{flex:1;overflow-x:auto;display:flex;gap:.875rem;padding:1rem;align-items:flex-start}
.col{flex:0 0 230px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 104px);box-shadow:3px 3px 0 var(--border)}
.col-header{display:flex;align-items:center;justify-content:space-between;padding:.625rem .75rem;border-bottom:1.5px solid var(--border);cursor:pointer;user-select:none;background:transparent;border-radius:var(--radius) var(--radius) 0 0}
.col.collapsed .col-header{border-bottom:none;border-radius:var(--radius)}
.col-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text)}
.col-count{background:var(--primary);color:#fff;font-size:.68rem;font-weight:800;padding:.15rem .45rem;border-radius:20px;min-width:20px;text-align:center}
.col.muted .col-count{background:var(--border-light);color:var(--muted)}
.col-body{overflow-y:auto;padding:.625rem .5rem .625rem;flex:1;min-height:60px;display:flex;flex-direction:column;gap:.4rem}
.col-body.drag-over{background:var(--primary-light)}
.col.collapsed .col-body{display:none}
.empty-col{text-align:center;padding:2rem .5rem;color:#c9c5bc;font-size:.78rem;border:1.5px dashed #c9c5bc;border-radius:var(--radius);flex:0}

/* Cards */
.card{background:var(--surface);border-radius:var(--radius);padding:.625rem .75rem;box-shadow:var(--card-shadow);cursor:pointer;border:1.5px solid var(--border);transition:transform .12s,box-shadow .12s;position:relative}
.card:hover{transform:translate(-1px,-1px);box-shadow:var(--card-shadow-hover)}
.card:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--border)}
.card.dragging{opacity:.45;transform:scale(.97)}
.card-title{font-size:.85rem;font-weight:600;line-height:1.4;margin-bottom:.45rem;color:var(--text)}
.card-meta{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.card-id{font-size:.6rem;color:#c9c5bc;font-family:monospace;margin-top:.4rem;text-align:right;letter-spacing:.02em}
.card.dimmed{opacity:.3}

/* Chips */
.chip{font-size:.66rem;font-weight:700;padding:.15rem .4rem;border-radius:4px;white-space:nowrap;border:1px solid transparent}
.cat-feature{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
.cat-bug{background:#fee2e2;color:#b91c1c;border-color:#fca5a5}
.cat-chore{background:#f1f0ec;color:#5c5852;border-color:#d6d2ca}
.cat-improvement{background:#dcfce7;color:#166534;border-color:#86efac}
.cat-other{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.score{font-size:.64rem;font-weight:800;padding:.15rem .35rem;border-radius:4px;font-family:monospace}
.score-v{background:#dcfce7;color:#166534}
.score-c{background:#fef9c3;color:#854d0e}
.score-r{background:#fee2e2;color:#b91c1c}
.sprint-badge{font-size:.63rem;color:var(--primary-dark);background:var(--primary-light);padding:.1rem .35rem;border-radius:4px;font-weight:700;border:1px solid #9fd0dc}
.est-badge{font-size:.63rem;color:#6d28d9;background:#ede9fe;padding:.1rem .35rem;border-radius:4px;font-weight:700}
.assignee-badge{font-size:.63rem;padding:.1rem .35rem;border-radius:10px;background:#f1f0ec;color:#5c5852;font-weight:700;border:1px solid #d6d2ca}
.assignee-mine{background:var(--primary-light);color:var(--primary-dark);border-color:#9fd0dc}

/* Activity panel */
#activity-panel{flex-shrink:0;background:var(--surface);border-left:1.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;width:260px;transition:width .2s}
#activity-panel.hidden{width:0;border-left:none;overflow:hidden}
.activity-head{display:flex;align-items:center;justify-content:space-between;padding:.625rem .875rem .5rem;border-bottom:1.5px solid var(--border-light);flex-shrink:0}
.activity-head h3{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.activity-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.9rem;padding:.1rem .3rem;border-radius:4px;line-height:1;font-family:var(--font)}
.activity-close:hover{background:var(--bg);color:var(--text)}
#activity-list{overflow-y:auto;flex:1;padding:.5rem .75rem .75rem}
.act-event{padding:.45rem .5rem;border-radius:var(--radius);margin-bottom:.25rem;font-size:.75rem}
.act-event:hover{background:var(--bg)}
.act-row{display:flex;align-items:flex-start;gap:.4rem}
.act-icon{font-size:.75rem;margin-top:.05rem;flex-shrink:0}
.act-body{line-height:1.35}
.act-who{font-weight:700}
.act-time{font-size:.66rem;color:#c9c5bc}
.no-activity{color:#c9c5bc;font-size:.78rem;padding:.5rem;text-align:center}

/* Modal */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;z-index:100}
.modal{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);width:620px;max-width:95vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:6px 6px 0 var(--border)}
.modal-header{padding:1.25rem 1.5rem 0;display:flex;align-items:flex-start;gap:.75rem}
.modal-title{font-size:1.1rem;font-weight:800;flex:1;line-height:1.3;letter-spacing:-.02em}
.modal-close{background:none;border:1.5px solid var(--border);font-size:1rem;cursor:pointer;color:var(--muted);flex-shrink:0;padding:.5rem .65rem;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);font-family:var(--font);box-shadow:2px 2px 0 var(--border)}.modal-close:hover{background:var(--bg)}
.modal-meta{display:flex;flex-wrap:wrap;gap:.4rem;padding:.875rem 1.5rem;border-bottom:1.5px solid var(--border-light)}
.modal-body{overflow-y:auto;padding:1rem 1.5rem;flex:1}
.modal-body h3{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:.875rem 0 .4rem}
.meta-row{display:flex;gap:1.5rem;font-size:.82rem;padding:.5rem 0;color:var(--muted)}
.md-content{font-size:.875rem;line-height:1.65}
.md-content p{margin-bottom:.75rem}
.md-content h1,.md-content h2{font-size:.95rem;font-weight:800;margin:.75rem 0 .3rem;border-bottom:1px solid var(--border-light);padding-bottom:.2rem}
.md-content h3,.md-content h4{font-size:.875rem;font-weight:700;margin:.6rem 0 .25rem}
.md-content ul,.md-content ol{padding-left:1.25rem;margin-bottom:.5rem}
.md-content li{margin-bottom:.2rem}
.md-content code{background:#f1f0ec;padding:.1rem .3rem;border-radius:4px;font-family:monospace;font-size:.83em}
.md-content pre{background:#f1f0ec;padding:.75rem;border-radius:var(--radius);overflow-x:auto;margin-bottom:.5rem;border:1px solid var(--border-light)}
.md-content pre code{background:none;padding:0}
.md-content hr{border:none;border-top:1.5px solid var(--border-light);margin:.75rem 0}
.modal-loading{padding:2rem;text-align:center;color:var(--muted);font-size:.9rem}

/* Mine filter */
.mine-filter{font-size:.75rem;padding:.32rem .55rem;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-family:var(--font);font-weight:700;box-shadow:2px 2px 0 var(--border);transition:transform .1s,box-shadow .1s}
.mine-filter:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--border)}
.mine-filter.active{background:var(--primary);color:#fff;border-color:var(--primary-dark)}

/* Toast */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#111;color:#fffdf7;padding:.55rem 1.1rem;border-radius:var(--radius);font-size:.82rem;z-index:200;opacity:1;transition:opacity .3s;border:1.5px solid #444;font-weight:600}
.toast.fade{opacity:0}

/* --- Mobile (<= 640px) ---------------------------------------------------
   The board is a horizontal flex row of fixed-width columns plus a docked
   activity panel — both assume desktop width. On a phone the panel would eat
   two thirds of the viewport and the columns clip their card titles, so the
   panel becomes a slide-over and the columns become one-per-screen with
   scroll-snap. The panel keeps using the .hidden class, so setActivityVisible()
   needs no mobile branch. */
@media (max-width: 640px) {
  header{padding:.5rem .625rem;gap:.4rem;flex-wrap:wrap;min-height:0}
  .hdr-logo{display:none}          /* the shell topbar already brands the page */
  header select{flex:1 1 6rem;min-width:0;max-width:9rem;font-size:.75rem}
  #user-badge{display:none}        /* duplicated in the shell topbar */
  .spacer{flex:1 1 auto}

  /* Embedded in the shell, the surrounding topbar already offers the project
     picker, theme toggle and logout. Repeating them here wraps the board
     header onto a second row and costs a phone a chunk of board. Only hide
     them when a parent frame is actually providing them. */
  body.embedded header{flex-wrap:nowrap}
  body.embedded #project-select,
  body.embedded #theme-btn,
  body.embedded #logout-btn{display:none}
  .mine-filter{font-size:.7rem;padding:.3rem .45rem}
  .icon-btn{min-width:2rem;min-height:2rem}

  #board-columns{padding:.625rem;gap:.625rem;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch}
  .col{flex:0 0 84vw;scroll-snap-align:center;max-height:none}
  .col-body{max-height:none}

  /* Slide-over instead of a docked column. */
  #activity-panel{position:fixed;top:0;right:0;bottom:0;z-index:150;
    width:min(88vw,320px);border-left:1.5px solid var(--border);
    box-shadow:-4px 0 0 rgba(17,17,17,.12);
    transition:transform .2s ease;transform:translateX(0)}
  #activity-panel.hidden{width:min(88vw,320px);transform:translateX(100%);
    border-left:1.5px solid var(--border)}
  .activity-close{font-size:1.1rem;padding:.3rem .5rem}
}
</style>
</head>
<body>
<script>
/* Run before first paint: the mobile header rules below depend on knowing
   whether the shell is wrapping us, and toggling it later would reflow. */
if (window.parent !== window) document.body.classList.add('embedded');
</script>

<div id="login-gate">
  <div class="login-card">
    <h1>Memaix</h1>
    <p id="login-subtitle"></p>
    <div class="form-group">
      <label id="login-label-user" for="login-user">Username</label>
      <input id="login-user" type="text" placeholder="alice" autocomplete="username" aria-label="Username">
    </div>
    <div class="form-group">
      <label id="login-label-pass" for="login-pass">Password</label>
      <input id="login-pass" type="password" placeholder="..." autocomplete="current-password" aria-label="Password">
    </div>
    <button class="btn-primary" id="login-btn"></button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="board-shell" hidden>
  <header>
    <span class="hdr-logo">&#x2B21; memaix</span>
    <select id="project-select" aria-label="Project"></select>
    <select id="sprint-select" aria-label="Sprint"></select>
    <button class="mine-filter" id="mine-btn" data-i18n="board_my_tasks">Mina tasks</button>
    <button class="icon-btn" id="refresh-btn">&#x21BB;</button>
    <div class="spacer"></div>
    <span id="user-badge"></span>
    <button class="icon-btn" id="theme-btn" title="Byt tema">&#x263C;</button>
    <button class="icon-btn" id="activity-toggle-btn" title="Visa/dölj aktivitet">&#x2630;</button>
    <button class="icon-btn" id="logout-btn"></button>
  </header>
  <div id="main-area">
    <div id="board-columns"></div>
    <div id="activity-panel">
      <div class="activity-head">
        <h3 id="activity-heading">Activity</h3>
        <button class="activity-close" id="activity-close-btn" title="Stäng">&#x2715;</button>
      </div>
      <div id="activity-list"></div>
    </div>
  </div>
</div>

<div id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" id="modal-close">&#x2715;</button>
    </div>
    <div class="modal-meta" id="modal-meta"></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
'use strict';
var I18N=window.I18N||{};
function t(k){return I18N[k]||k;}

var _user=null,_project=null,_sprint='',_activityTimer=null,_lastTs='',_dragId=null,_dragFrom=null,_mineOnly=false;

function gid(id){return document.getElementById(id);}

(function initI18N(){
  document.documentElement.lang=I18N._locale||'en';
  document.title=t('page_title_board');
  gid('login-subtitle').textContent=t('login_subtitle');
  gid('login-label-user').textContent=t('login_label_username');
  gid('login-label-pass').textContent=t('login_label_password');
  gid('login-btn').textContent=t('login_btn');
  gid('refresh-btn').title=t('board_btn_refresh');
  gid('logout-btn').textContent=t('board_btn_logout');
  gid('activity-heading').textContent=t('activity_heading');
  gid('activity-list').appendChild(el('p','no-activity',t('board_loading')));
})();

function toast(msg,err){
  var e=document.createElement('div');e.className='toast';e.textContent=msg;
  if(err)e.style.background='#b91c1c';
  document.body.appendChild(e);
  setTimeout(function(){e.classList.add('fade');setTimeout(function(){e.remove();},350);},2500);
}

function reltime(ts){
  if(!ts)return'';
  var d=(Date.now()-new Date(ts).getTime())/1000;
  if(d<60)return t('time_just_now');
  if(d<3600)return Math.round(d/60)+'m';
  if(d<86400)return Math.round(d/3600)+'h';
  return Math.round(d/86400)+'d';
}

function catCls(cat){
  return{feature:'cat-feature',bug:'cat-bug',chore:'cat-chore',improvement:'cat-improvement'}[cat]||'cat-other';
}

function el(tag,cls,txt){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(txt!=null)e.textContent=txt;
  return e;
}
function chip(txt,cls){return el('span','chip '+cls,txt);}
function score(txt,cls){return el('span','score '+cls,txt);}

function mdNodes(src){
  var frag=document.createDocumentFragment();
  if(!src)return frag;
  src.split(/\n\n+/).forEach(function(block){
    block=block.trim();if(!block)return;
    var hm=block.match(/^(#{1,4})\s+([^\n]+)/);
    if(hm){frag.appendChild(el('h'+Math.min(hm[1].length,4),'',hm[2]));return;}
    if(/^---+$/.test(block)){frag.appendChild(document.createElement('hr'));return;}
    var cm=block.match(/^```(?:[^\n]+)?\n?([\s\S]+?)```$/); // NOSONAR — user's own content, not adversarial input
    if(cm){var pre=el('pre');pre.appendChild(el('code','',cm[1]));frag.appendChild(pre);return;}
    if(/^- /m.test(block)){
      var ul=el('ul');
      block.split('\n').forEach(function(ln){if(ln.startsWith('- ')){var li=el('li');inlineNodes(li,ln.slice(2));ul.appendChild(li);}});
      frag.appendChild(ul);return;
    }
    if(/^\d+\. /m.test(block)){
      var ol=el('ol');
      block.split('\n').forEach(function(ln){var lm=ln.match(/^\d+\.\s+([^\n]+)/);if(lm){var li=el('li');inlineNodes(li,lm[1]);ol.appendChild(li);}});
      frag.appendChild(ol);return;
    }
    var p=el('p');inlineNodes(p,block.replaceAll('\n',' '));frag.appendChild(p);
  });
  return frag;
}

function inlineNodes(parent,txt){
  var re=/(`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*)/g,last=0,m;
  while((m=re.exec(txt))!==null){
    if(m.index>last)parent.appendChild(document.createTextNode(txt.slice(last,m.index)));
    var tok=m[0],e2;
    if(tok[0]==='`'){e2=el('code','',tok.slice(1,-1));}
    else if(tok.startsWith('**')){e2=el('strong','',tok.slice(2,-2));}
    else{e2=el('em','',tok.slice(1,-1));}
    parent.appendChild(e2);last=re.lastIndex;
  }
  if(last<txt.length)parent.appendChild(document.createTextNode(txt.slice(last)));
}

function api(url,opts,silentAuth){
  opts=opts||{};opts.credentials='include';
  return fetch(url,opts).then(function(r){
    if(r.status===401){if(!silentAuth)handle401();return null;}
    return r;
  });
}

function handle401(){
  _user=null;stopActivity();
  gid('board-shell').hidden=true;gid('login-gate').style.display='flex';
  gid('login-error').textContent=t('login_error_session_expired');
}

function login(){
  var u=gid('login-user').value.trim(),p=gid('login-pass').value;
  gid('login-error').textContent='';
  gid('login-btn').disabled=true;gid('login-btn').textContent=t('login_btn_loading');
  fetch('/board/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:u,password:p}),credentials:'include'})
  .then(function(r){
    if(r.ok)return r.json().then(function(d){_user=d.user;boot();});
    gid('login-error').textContent=t('login_error_credentials');
  }).catch(function(){gid('login-error').textContent=t('login_error_server');})
  .finally(function(){gid('login-btn').disabled=false;gid('login-btn').textContent=t('login_btn');});
}

function logout(){
  fetch('/board/auth/logout',{method:'POST',credentials:'include'}).finally(function(){
    _user=null;stopActivity();
    gid('board-shell').hidden=true;gid('login-gate').style.display='flex';
  });
}

function boot(){
  gid('login-gate').style.display='none';gid('board-shell').hidden=false;
  gid('user-badge').textContent=_user||'';
  api('/board/api/projects').then(function(r){
    if(!r)return;
    r.json().then(function(d){_user=d.user;gid('user-badge').textContent=_user;fillProjects(d.projects);});
  });
}

function fillProjects(projects){
  var sel=gid('project-select');sel.textContent='';
  if(!projects.length){
    sel.appendChild(el('option','',t('board_no_projects')));
    gid('board-columns').textContent=t('board_no_projects');
    return;
  }
  var urlProject=new URLSearchParams(location.search).get('project');
  var saved=urlProject||localStorage.getItem('mb_proj');
  projects.forEach(function(p){var o=el('option','',p);o.value=p;if(p===saved)o.selected=true;sel.appendChild(o);});
  _project=sel.value;
  if(urlProject)localStorage.setItem('mb_proj',_project);
  loadSprints().then(loadBoard);startActivity();
}

function loadSprints(){
  if(!_project)return Promise.resolve();
  return api('/board/api/sprints?project='+encodeURIComponent(_project)).then(function(r){
    if(!r)return;
    r.json().then(function(d){
      var sel=gid('sprint-select');var cur=sel.value;sel.textContent='';
      sel.appendChild(el('option','',t('board_all_items')));
      if(d.active){var a=el('option','',t('board_active_sprint'));a.value='active';sel.appendChild(a);}
      (d.sprints||[]).forEach(function(sp){
        var o=el('option','',sp.id+(sp.goal?' — '+sp.goal:'')+'  ('+sp.item_count+')');
        o.value=sp.id;if(sp.id===cur)o.selected=true;sel.appendChild(o);
      });
      _sprint=sel.value;
    });
  });
}

function loadBoard(){
  if(!_project)return Promise.resolve();
  var url='/board/api/board?project='+encodeURIComponent(_project);
  if(_sprint)url+='&sprint='+encodeURIComponent(_sprint);
  return api(url,null,true).then(function(r){
    if(!r)return;
    if(!r.ok){r.json().then(function(e){toast(e.error||t('board_load_error'),true);});return;}
    r.json().then(renderBoard);
  });
}

function renderBoard(data){
  var wrap=gid('board-columns');
  var collapsed=JSON.parse(localStorage.getItem('mb_col')||'{}');
  wrap.textContent='';
  (data.columns||[]).forEach(function(col){wrap.appendChild(buildCol(col,collapsed[col.key]));});
  initDnD();
}

function buildCol(col,isCol){
  var div=el('div','col'+(col.muted?' muted':'')+(isCol?' collapsed':''));
  div.dataset.status=col.key;
  var hdr=el('div','col-header');
  hdr.appendChild(el('span','col-label',col.label));
  hdr.appendChild(el('span','col-count',col.cards.length));
  hdr.addEventListener('click',function(){toggleCol(div,col.key);});
  div.appendChild(hdr);
  var body=el('div','col-body');body.dataset.status=col.key;
  if(!col.cards.length){body.appendChild(el('div','empty-col',t('board_col_empty')));}
  else{col.cards.forEach(function(c){body.appendChild(buildCard(c));});}
  div.appendChild(body);return div;
}

function toggleCol(div,key){
  div.classList.toggle('collapsed');
  var c=JSON.parse(localStorage.getItem('mb_col')||'{}');
  c[key]=div.classList.contains('collapsed');
  localStorage.setItem('mb_col',JSON.stringify(c));
}

function buildCard(card){
  var div=el('div','card');div.draggable=true;
  div.dataset.id=card.id;div.dataset.status=card.status;
  div.appendChild(el('div','card-title',card.title));
  var meta=el('div','card-meta');
  if(card.category)meta.appendChild(chip(card.category,catCls(card.category)));
  if(card.value!=null)meta.appendChild(score('V'+card.value,'score-v'));
  if(card.complexity!=null)meta.appendChild(score('C'+card.complexity,'score-c'));
  if(card.risk!=null)meta.appendChild(score('R'+card.risk,'score-r'));
  if(card.sprint)meta.appendChild(el('span','sprint-badge',card.sprint));
  if(card.estimate!=null)meta.appendChild(el('span','est-badge',card.estimate+'p'));
  if(card.assignee){var a=el('span','assignee-badge','@'+card.assignee);
    if(card.assignee===_user)a.className='assignee-badge assignee-mine';meta.appendChild(a);}
  div.appendChild(meta);div.appendChild(el('div','card-id',card.id));
  div.addEventListener('click',function(){openModal(card.id);});
  if(_mineOnly&&card.assignee!==_user)div.classList.add('dimmed');
  return div;
}

function initDnD(){
  document.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('dragstart',function(e){
      _dragId=card.dataset.id;_dragFrom=card.dataset.status;
      card.classList.add('dragging');e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',function(){card.classList.remove('dragging');});
  });
  document.querySelectorAll('.col-body').forEach(function(body){
    body.addEventListener('dragover',function(e){e.preventDefault();body.classList.add('drag-over');});
    body.addEventListener('dragleave',function(){body.classList.remove('drag-over');});
    body.addEventListener('drop',function(e){
      e.preventDefault();body.classList.remove('drag-over');
      var to=body.dataset.status;if(!_dragId||to===_dragFrom)return;
      doMove(_dragId,_dragFrom,to,body);
    });
  });
}

function doMove(id,from,to,targetBody){
  var cardEl=document.querySelector('.card[data-id="'+id+'"]');
  var srcBody=document.querySelector('.col-body[data-status="'+from+'"]');
  if(!cardEl)return;
  cardEl.dataset.status=to;_dragFrom=to;
  var empt=targetBody.querySelector('.empty-col');if(empt)empt.remove();
  targetBody.appendChild(cardEl);updateCount(from);updateCount(to);
  if(srcBody&&!srcBody.querySelector('.card'))srcBody.appendChild(el('div','empty-col',t('board_col_empty')));
  api('/board/api/item/'+encodeURIComponent(id),{
    method:'PATCH',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({project:_project,status:to})
  }).then(function(r){
    if(!r||!r.ok){
      toast(t('board_move_error'),true);
      cardEl.dataset.status=from;
      var orig=document.querySelector('.col-body[data-status="'+from+'"]');
      if(orig){var e2=orig.querySelector('.empty-col');if(e2)e2.remove();orig.appendChild(cardEl);}
      updateCount(from);updateCount(to);return;
    }
    toast(t('board_moved_to')+' '+to);
  });
}

function updateCount(status){
  var b=document.querySelector('.col-body[data-status="'+status+'"]');
  var col=b&&b.closest('.col');var badge=col&&col.querySelector('.col-count');
  if(badge)badge.textContent=b.querySelectorAll('.card').length;
}

function openModal(id){
  gid('modal-title').textContent='…';
  gid('modal-meta').textContent='';gid('modal-body').textContent='';
  gid('modal-body').appendChild(el('div','modal-loading',t('board_loading')));
  gid('modal-overlay').style.display='flex';
  api('/board/api/item/'+encodeURIComponent(id)+'?project='+encodeURIComponent(_project)).then(function(r){
    if(!r||!r.ok){gid('modal-body').textContent='';gid('modal-body').appendChild(el('div','modal-loading',t('board_load_error')));return;}
    r.json().then(function(item){renderModal(id,item);});
  });
}

function renderModal(id,item){
  var loc=I18N._locale||'en';
  gid('modal-title').textContent=item.title||id;
  var meta=gid('modal-meta');meta.textContent='';
  if(item.category)meta.appendChild(chip(item.category,catCls(item.category)));
  if(item.status){var st=el('span','chip',item.status);st.style.cssText='background:#e2e8f0;color:#334155';meta.appendChild(st);}
  if(item.value!=null)meta.appendChild(score(t('modal_label_value')+item.value,'score-v'));
  if(item.complexity!=null)meta.appendChild(score(t('modal_label_complexity')+item.complexity,'score-c'));
  if(item.risk!=null)meta.appendChild(score(t('modal_label_risk')+item.risk,'score-r'));
  if(item.sprint)meta.appendChild(el('span','sprint-badge',item.sprint));
  if(item.estimate!=null)meta.appendChild(el('span','est-badge',item.estimate+'p'));
  var body=gid('modal-body');body.textContent='';
  var r1=el('div','meta-row');
  var idS=el('span');idS.appendChild(el('strong','',t('modal_label_id')+' '));idS.appendChild(document.createTextNode(id));r1.appendChild(idS);
  var vS=el('span');vS.appendChild(el('strong','',t('modal_label_version')+' '));vS.appendChild(document.createTextNode(item.version!=null?item.version:'–'));r1.appendChild(vS);
  body.appendChild(r1);
  var r2=el('div','meta-row');
  var cS=el('span');cS.appendChild(el('strong','',t('modal_label_created')+' '));cS.appendChild(document.createTextNode(item.created_at?new Date(item.created_at).toLocaleString(loc):'–'));r2.appendChild(cS);
  var uS=el('span');uS.appendChild(el('strong','',t('modal_label_updated')+' '));uS.appendChild(document.createTextNode(item.updated_at?new Date(item.updated_at).toLocaleString(loc):'–'));r2.appendChild(uS);
  body.appendChild(r2);
  body.appendChild(el('h3','',t('modal_label_description')));
  var mdDiv=el('div','md-content');
  if(item.body&&item.body.trim()){mdDiv.appendChild(mdNodes(item.body));}
  else{var em=el('em');em.style.color='#94a3b8';em.textContent=t('board_no_description');mdDiv.appendChild(em);}
  body.appendChild(mdDiv);
}

function closeModal(){gid('modal-overlay').style.display='none';}

function startActivity(){stopActivity();pollActivity();_activityTimer=setInterval(pollActivity,5000);}
function stopActivity(){if(_activityTimer)clearInterval(_activityTimer);_activityTimer=null;}

function pollActivity(){
  var url='/board/api/activity';var params=[];
  if(_project)params.push('project='+encodeURIComponent(_project));
  if(_lastTs)params.push('since='+encodeURIComponent(_lastTs));
  if(params.length)url+='?'+params.join('&');
  api(url,null,true).then(function(r){
    if(!r||!r.ok)return;
    r.json().then(function(d){
      if(d.events&&d.events.length){
        var lt=d.events[d.events.length-1].ts;if(lt>_lastTs)_lastTs=lt;
        prependActivity(d.events);
      }else if(_lastTs===''){
        gid('activity-list').textContent='';
        gid('activity-list').appendChild(el('p','no-activity',t('board_no_activity')));
      }
    });
  });
}

function prependActivity(events){
  var list=gid('activity-list');
  var noAct=list.querySelector('.no-activity');if(noAct)noAct.remove();
  var frag=document.createDocumentFragment();
  events.slice().reverse().forEach(function(e){
    var div=el('div','act-event');
    var row=el('div','act-row');
    var icon=el('span','act-icon',e.ok?'v':'x');icon.style.color=e.ok?'#22c55e':'#ef4444';
    row.appendChild(icon);
    var bd=el('div','act-body');
    bd.appendChild(el('span','act-who',e.user||''));
    bd.appendChild(document.createTextNode(' · '));
    var tsp=el('span');tsp.style.color='var(--muted)';tsp.textContent=e.tool||'';bd.appendChild(tsp);
    bd.appendChild(el('span','act-time',' '+reltime(e.ts)));
    if(e.project){var proj=el('div');proj.style.cssText='font-size:.7rem;color:var(--primary)';proj.textContent=e.project;bd.appendChild(proj);}
    if(e.detail){var det=el('div');det.style.cssText='font-size:.72rem;color:var(--muted)';det.textContent=e.detail;bd.appendChild(det);}
    row.appendChild(bd);div.appendChild(row);frag.appendChild(div);
  });
  list.insertBefore(frag,list.firstChild);
  while(list.children.length>50)list.removeChild(list.lastChild);
}


function setActivityVisible(visible){
  var panel=gid('activity-panel');
  var btn=gid('activity-toggle-btn');
  if(visible){panel.classList.remove('hidden');btn.classList.add('active');}
  else{panel.classList.add('hidden');btn.classList.remove('active');}
  localStorage.setItem('mb_activity',visible?'1':'0');
}
(function initActivityState(){
  var saved=localStorage.getItem('mb_activity');
  // On a phone the panel is a slide-over covering most of the board, so it
  // stays shut until asked for. On desktop it is docked and free, so it opens.
  if(saved===null)saved=window.matchMedia('(max-width: 640px)').matches?'0':'1';
  setActivityVisible(saved!=='0');
})();

gid('login-btn').addEventListener('click',login);
gid('login-pass').addEventListener('keydown',function(e){if(e.key==='Enter')login();});
gid('login-user').addEventListener('keydown',function(e){if(e.key==='Enter')gid('login-pass').focus();});
gid('logout-btn').addEventListener('click',logout);
gid('modal-close').addEventListener('click',closeModal);
gid('modal-overlay').addEventListener('click',function(e){if(!e.target.closest('.modal'))closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
gid('refresh-btn').addEventListener('click',function(){loadBoard();pollActivity();});
gid('mine-btn').addEventListener('click',function(){
  _mineOnly=!_mineOnly;this.classList.toggle('active',_mineOnly);loadBoard();
});
gid('project-select').addEventListener('change',function(){
  _project=gid('project-select').value;_sprint='';_lastTs='';
  localStorage.setItem('mb_proj',_project);loadSprints().then(loadBoard);
});
gid('sprint-select').addEventListener('change',function(){_sprint=gid('sprint-select').value;loadBoard();});


function applyTheme(dark){
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var btn = gid('theme-btn');
  if(btn) btn.innerHTML = dark ? '&#x263D;' : '&#x263C;';
  // Sync to shell (same origin)
  try{window.parent.document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    var pb=window.parent.document.getElementById('theme-btn');
    if(pb)pb.textContent=dark?'\u263D':'\u263C';}catch(e){}
}
(function initTheme(){
  var saved = localStorage.getItem('mb_theme');
  var prefersDark = saved === 'dark';
  applyTheme(prefersDark);
})();

gid('theme-btn').addEventListener('click',function(){
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  applyTheme(!isDark);
  localStorage.setItem('mb_theme', isDark ? 'light' : 'dark');
});
gid('activity-toggle-btn').addEventListener('click',function(){
  var hidden=gid('activity-panel').classList.contains('hidden');
  setActivityVisible(hidden);
});
gid('activity-close-btn').addEventListener('click',function(){setActivityVisible(false);});

fetch('/board/api/projects',{credentials:'include'}).then(function(r){
  if(r.ok)r.json().then(function(d){_user=d.user;gid('login-gate').style.display='none';gid('board-shell').hidden=false;gid('user-badge').textContent=_user;fillProjects(d.projects);});
}).catch(function(){});
</script>
</body>
</html>
