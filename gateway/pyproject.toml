[project]
name = "memaix-gateway"
version = "0.1.0"
description = "Memaix — self-hosted, AI-agnostic assistant gateway (MCP)"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    # Varje beroende har ett tak vid nästa major. Skälet är konkret: en
    # ombyggnad 2026-09-02 av en oförändrad commit drog in mcp 2.x och
    # gatewayen slutade starta. Kommentaren efter varje rad är den version
    # som kördes i produktion när taket sattes.
    # Låst till 1.x med flit: server.py bygger på FastMCP, som i mcp 2.x
    # döptes om till MCPServer med ändrat API. Lyft först efter migrering.
    "mcp>=1.2,<2",
    "httpx>=0.27,<1",            # kör 0.28.1
    "uvicorn>=0.29,<1",          # kör 0.52.4
    "pyyaml>=6,<7",              # kör 6.0.3
    "imap-tools>=1.5,<2",        # kör 1.15.0
    "caldav>=1.3,<4",            # kör 3.2.1
    "vobject>=0.9,<1",           # kör 0.9.9
    "requests>=2.31,<3",         # kör 2.34.2
    "python-dateutil>=2.8,<3",   # kör 2.9.0
    "cryptography>=42,<51",      # kör 50.0.1
    "pyjwt>=2.8,<3",             # kör 2.13.0
    "numpy>=1.26,<3",            # kör 2.5.2
    "defusedxml>=0.7,<1",        # kör 0.7.1
    "pydantic>=2.6,<3",          # kör 2.13.5
    "google-auth>=2.29,<3",
    "google-api-python-client>=2.130,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-anyio",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
]
# Optional local semantic embedder (FEATURE-SEMANTIC-SEARCH.md). Without it,
# search_all() degrades gracefully to lexical (FTS5) search only.
search = [
    "sentence-transformers>=2.7",
]
# Optional CP-SAT allocator (FEATURE-PM-ENGINE.md Byggordning steg 7). Without
# it, pm/allocate_cpsat.py raises a clear ImportError and the heuristic
# allocator (pm/allocate.py) remains the default.
pm = [
    "ortools>=9.9",
]
# Browser end-to-end tests for the web UI (tests_e2e/ — not part of the
# default unit run). Requires a Chromium: `python -m playwright install
# chromium`, or the pre-provisioned /opt/pw-browsers fallback.
e2e = [
    "playwright>=1.45",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"memaix_gateway" = [
    "web/pages/*.html",
    "web/static/*.css",
    "web/static/*.js",
    "board/*.html",
    # The embeddable booking widget. It lives with the booking module rather
    # than in web/static/ because it is the booking feature's public face, not
    # part of the logged-in app shell — and because a missing entry here is
    # invisible until /embed/booking.js 500s in production.
    "booking/static/*.js",
    "i18n/locales/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# server.py's lazy-singleton globals are annotated with string forward-refs
# to classes that are only imported inside the functions that assign them
# (kept out of module scope to avoid heavy imports at startup). mypy accepts
# these via inline `# type: ignore[name-defined]`; ruff's F821 doesn't look
# at those comments, so it's silenced here instead.
"src/memaix_gateway/server.py" = ["F821"]

# routes.py embeds inline HTML/CSS pages (privacy, terms) as triple-quoted
# string constants; those lines are inherently long and can't carry a per-line
# noqa, so E501 is silenced for this file only.
"src/memaix_gateway/web/routes.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.bandit]
# Accepted-by-design patterns, not genuine findings — see docs/THREAT-MODEL.md:
#   B101 - assert used to document/enforce invariants mypy can't infer from
#          control flow (e.g. "just inserted, so the row exists"); never used
#          for security control flow, so stripping under -O is harmless.
#   B108 - hardcoded /tmp/... default paths; every one is overridable via a
#          MEMAIX_*_DB env var and used only as a fallback default.
#   B110 - try/except/pass: best-effort operations (notification channel
#          delivery, UI hints) where failure must never break the caller.
#   B112 - try/except/continue: same best-effort pattern inside a loop.
#   B404/B603/B607 - subprocess used only to shell out to `git` with a list
#          of args (never shell=True, never a partial/untrusted path).
# Genuine findings (SQL string-building, XML parsing, password args, SSRF-ish
# urlopen) are fixed at the call site or annotated individually with a
# `# nosec <ID> -- <reason>` comment instead of a blanket skip.
skips = ["B101", "B108", "B110", "B112", "B404", "B603", "B607"]
