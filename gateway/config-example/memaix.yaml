# Memaix-server-konfiguration (exempelfil).

server:
  bind: "0.0.0.0:8080"
  public_url: "http://localhost:8080"

# auth: kommenteras in när Hydra-infrastruktur finns.
# auth:
#   issuer: "https://hydra.example.com"
#   resource_server_url: "https://mcp.example.com"

# oauth_providers: behövs för account_link-flödet (Fas 5 med Hydra).
# oauth_providers:
#   google:
#     client_id: "..."
#     client_secret_ref: "env:GOOGLE_CLIENT_SECRET"
#     scopes: ["openid", "email", "https://www.googleapis.com/auth/gmail.readonly"]

# booking: den publika bokningssidans inställningar (memaix-src card
# 2bef1062). Utan turnstile_secret_ref vägrar /book/{slug} varje bokning —
# captcha är obligatoriskt, inte valfritt, för den publika ytan.
# booking:
#   turnstile_secret_ref: "env:TURNSTILE_SECRET"

# nextcloud_provision: ett eget Nextcloud-konto per projekt (valfritt). Med
# detta block skapar project_create även användaren `memaix-<projekt>` via
# OCS-API:t och kopplar den som projektets `files:`-resurs (syns på /app/files).
# Lösenordet genereras och sparas i <config-katalogen>/secrets/nc-<projekt>
# (läge 0600), refererat som `file:`.
# nextcloud_provision:
#   url: "http://nextcloud:8081"
#   admin_user: "memaix-provisioner"
#   admin_password_ref: "env:NEXTCLOUD_ADMIN_PASSWORD"
#   quota: "2GB"           # valfritt, standard 2GB
#
# method: occ_ssh skapar kontot med `occ user:add` över ssh i stället för OCS
# (Nextcloud 32 kräver bekräftat lösenord för OCS addUser, vilket app-lösenord
# inte ger). Nyckeln på Nextcloud-värden är låst till ops/memaix-nc-provision.sh.
# nextcloud_provision:
#   method: "occ_ssh"
#   url: "http://nextcloud:8081"
#   ssh_host: "alienqronk"
#   ssh_user: "memaix-provision"
#   ssh_key_file: "/app/config/secrets/nc-provision-key"       # 0600
#   ssh_known_hosts: "/app/config/secrets/nc-provision-known_hosts"
#   quota: "2GB"

# mail_send_unlock: email_forward/email_reply (och, när enabled, ALLA
# mejlutskick från en modell) kräver en chattsession upplåst med en
# engångskod som skickas utanför chatten (docs/FEATURE-MAIL-DIALOG.md).
# Kanalens URL/ämne/token anges helst som *_ref och visas aldrig för modellen.
# mail_send_unlock:
#   enabled: true
#   ttl_hours: 4
#   channels:
#     - {type: discord, url_ref: "env:UNLOCK_DISCORD_WEBHOOK"}   # utan ?wait=true
#     # - {type: ntfy, topic_ref: "env:UNLOCK_NTFY_TOPIC", token_ref: "env:UNLOCK_NTFY_TOKEN"}
#     #   (ämnet minst 24 slumptecken; får inte vara samma som en brief-kanal)
#
# mail_dialog: tak för email_reply(reply_all=True).
# mail_dialog:
#   reply_all_max_cc: 20
