# Memaix-server-konfiguration (exempelfil).

server:
  bind: "0.0.0.0:8080"
  public_url: "http://localhost:8080"

# auth: kommenteras in när Hydra-infrastruktur finns.
# auth:
#   issuer: "https://hydra.example.com"
#   resource_server_url: "https://mcp.example.com"

# oauth_providers: behövs för account_link-flödet (Fas 5 med Hydra).
# oauth_providers:
#   google:
#     client_id: "..."
#     client_secret_ref: "env:GOOGLE_CLIENT_SECRET"
#     scopes: ["openid", "email", "https://www.googleapis.com/auth/gmail.readonly"]

# booking: den publika bokningssidans inställningar (memaix-src card
# 2bef1062). Utan turnstile_secret_ref vägrar /book/{slug} varje bokning —
# captcha är obligatoriskt, inte valfritt, för den publika ytan.
# booking:
#   turnstile_secret_ref: "env:TURNSTILE_SECRET"

# nextcloud_provision: ett eget Nextcloud-konto per projekt (valfritt). Med
# detta block skapar project_create även användaren `memaix-<projekt>` via
# OCS-API:t och kopplar den som projektets `files:`-resurs (syns på /app/files).
# Lösenordet genereras och sparas i <config-katalogen>/secrets/nc-<projekt>
# (läge 0600), refererat som `file:`.
# nextcloud_provision:
#   url: "http://nextcloud:8081"
#   admin_user: "memaix-provisioner"
#   admin_password_ref: "env:NEXTCLOUD_ADMIN_PASSWORD"
#   quota: "2GB"           # valfritt, standard 2GB
