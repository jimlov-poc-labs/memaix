# Exempelkonfiguration för Memaix-gatewayen.
# Kopiera och anpassa till din instans.

users:
  alice:
    # oauth_subjects: lista av OAuth-subjects (sub-claim) som mappar till denna användare.
    # Behövs inte i stdio-läge (MEMAIX_USER=alice räcker).
    oauth_subjects: []
    grants:
      demo: owner

projects:
  demo:
    # vault: sökväg till projektets vault-katalog (skapas automatiskt).
    vault: /tmp/memaix-demo-vault
    # allow_send: true = email_send tillåtet för ägare.
    allow_send: false
    # awaiting_link: valfri lista — vilka kapabiliteter som väntar på en
    # koppling (ingen hemlighet, bara en lapp för `cli.py backend-status`
    # att läsa, se docs/ACCESS-ADMIN.md §Koppla teamets mejl). Exempel:
    # awaiting_link: ["mail"]
